<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pixel Art Editor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17181c;
    --bg-elevated: #202127;
    --border: #33343b;
    --text: #e8e8ec;
    --text-faint: #8a8b93;
    --accent: #4f9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 12px/1.4 -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    flex-wrap: wrap;
    min-width: 0;
  }
  header strong { font-size: 13px; }
  label { color: var(--text-faint); display: flex; align-items: center; gap: 4px; }
  select, input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font: inherit;
  }
  button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--text-faint); }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  button.active { border-color: var(--accent); color: var(--accent); }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  .sidebar {
    width: 160px;
    border-right: 1px solid var(--border);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .swatch.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(45deg, #23242a 25%, transparent 25%, transparent 75%, #23242a 75%),
      linear-gradient(45deg, #23242a 25%, transparent 25%, transparent 75%, #23242a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .canvas-area.panning { cursor: grabbing; }
  canvas {
    image-rendering: pixelated;
    border: 1px solid var(--border);
    cursor: crosshair;
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  .status { color: var(--text-faint); overflow-wrap: break-word; min-width: 0; }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #4ade80; }
</style>
</head>
<body>
  <header>
    <strong>🎨 Pixel Art Editor</strong>

    <label>Grid
      <select id="gridSize">
        <option value="8">8×8</option>
        <option value="16" selected>16×16</option>
        <option value="24">24×24</option>
        <option value="32">32×32</option>
        <option value="48">48×48</option>
        <option value="custom" id="customSizeOption" style="display:none">Custom</option>
      </select>
    </label>

    <input type="color" id="colorPicker" value="#4f9eff" title="Custom color" />
    <label>Opacity
      <input type="range" id="opacity" min="0" max="100" value="100" title="Paint opacity" />
    </label>
    <label>Brush
      <input type="number" id="brushSize" min="1" max="8" value="1" style="width:3em" title="Brush size" />
    </label>
    <button id="eraserBtn" title="Eraser">Eraser</button>
    <button id="clearBtn" title="Clear the whole canvas">Clear</button>

    <label>Open
      <select id="openSelect">
        <option value="">Load existing…</option>
      </select>
    </label>

    <span style="flex:1"></span>

    <label>Save as
      <input type="text" id="filename" placeholder="my_sprite" />
    </label>
    <button id="saveBtn" class="primary">Save to Assets</button>
    <span class="status" id="status"></span>
  </header>

  <main>
    <div class="sidebar">
      <div>Palette</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="canvas-area">
      <canvas id="canvas"></canvas>
    </div>
  </main>

<script type="module">
  const params = new URLSearchParams(location.search);
  const project = params.get("project") || "";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const gridSizeSelect = document.getElementById("gridSize");
  const customSizeOption = document.getElementById("customSizeOption");
  const openSelect = document.getElementById("openSelect");
  const colorPicker = document.getElementById("colorPicker");
  const eraserBtn = document.getElementById("eraserBtn");
  const clearBtn = document.getElementById("clearBtn");
  const filenameInput = document.getElementById("filename");
  const saveBtn = document.getElementById("saveBtn");
  const statusEl = document.getElementById("status");
  const swatchesEl = document.getElementById("swatches");

  import { MIN_ZOOM, MAX_ZOOM, screenToGrid, zoomAt, panBy } from "./js/viewport.mjs";
  import { setCell } from "./js/grid.mjs";
  import { brushCells } from "./js/paint.mjs";
  import { createPalette, addColor, uniqueColors, loadPalette, savePalette } from "./js/palette.mjs";
  import { createUndoStack, pushSnapshot, undo, redo, resetUndoStack } from "./js/undo.mjs";

  const undoStack = createUndoStack();

  window.addEventListener("keydown", (e) => {
    if (document.activeElement.tagName === "INPUT") return;
    const key = e.key.toLowerCase();
    if (e.ctrlKey && key === "z" && !e.shiftKey) {
      e.preventDefault();
      const prev = undo(undoStack, cells);
      if (prev) {
        cells = prev;
        render();
      }
    } else if (e.ctrlKey && (key === "y" || (key === "z" && e.shiftKey))) {
      e.preventDefault();
      const next = redo(undoStack, cells);
      if (next) {
        cells = next;
        render();
      }
    }
  });

  const opacityInput = document.getElementById("opacity");
  const brushSizeInput = document.getElementById("brushSize");

  let palette = loadPalette(localStorage, project);

  function renderPalette() {
    swatchesEl.innerHTML = "";
    for (const color of palette.recent) {
      const el = document.createElement("div");
      el.className = "swatch";
      el.style.background = color === null
        ? "repeating-conic-gradient(#444 0% 25%, #222 0% 50%) 0 0 / 8px 8px"
        : color;
      el.title = color === null ? "transparent" : color;
      // Selection reflects tool state: the transparent swatch shows selected
      // while the eraser is active; a color swatch shows selected only when
      // it matches the current paint color AND the eraser isn't active.
      const isSelected = color === null ? eraserActive : (!eraserActive && color === colorPicker.value);
      if (isSelected) el.classList.add("selected");
      el.addEventListener("click", () => {
        if (color === null) {
          eraserActive = true;
        } else {
          eraserActive = false;
          colorPicker.value = color;
          opacityInput.value = 100;
        }
        eraserBtn.classList.toggle("active", eraserActive);
        renderPalette();
      });
      swatchesEl.appendChild(el);
    }
  }

  const canvasArea = document.querySelector(".canvas-area");
  let view = { zoom: 1, panX: 0, panY: 0 };

  function applyTransform() {
    canvas.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.zoom})`;
  }

  // Centers the canvas in the viewport at 1x zoom — called whenever the grid
  // is (re)loaded so a fresh/opened sprite starts fully visible and centered,
  // matching the old flex-centered layout's default appearance.
  function centerView() {
    const rect = canvasArea.getBoundingClientRect();
    view = {
      zoom: 1,
      panX: Math.round((rect.width - canvas.width) / 2),
      panY: Math.round((rect.height - canvas.height) / 2),
    };
    applyTransform();
  }

  const CELL_DISPLAY_SIZE = 20; // on-screen px per pixel-art cell
  let gridW = parseInt(gridSizeSelect.value, 10);
  let gridH = gridW;
  let cells = [];
  let eraserActive = false;
  let painting = false;
  let paintingErase = false; // right-click / eraser-tool paint = erase this stroke

  function currentColor() {
    const alpha = Number(opacityInput.value) / 100;
    const hex = colorPicker.value;
    if (alpha >= 1) return hex;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
  }

  const stripExt = (name) => name.replace(/\.png$/i, "");

  // Square canvas from a preset/typed size — the common "start a new sprite" path.
  function resetGrid(size) {
    loadGrid(size, size, Array.from({ length: size * size }, () => null));
    customSizeOption.style.display = "none";
    gridSizeSelect.value = String(size);
  }

  // Arbitrary WxH grid, populated from `data` (row-major, null = transparent) —
  // used both by resetGrid() and by opening an existing (possibly non-square) asset.
  function loadGrid(w, h, data) {
    gridW = w;
    gridH = h;
    cells = data;
    canvas.width = w * CELL_DISPLAY_SIZE;
    canvas.height = h * CELL_DISPLAY_SIZE;
    resetUndoStack(undoStack);
    render();
    centerView();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const color = cells[y * gridW + x];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x * CELL_DISPLAY_SIZE, y * CELL_DISPLAY_SIZE, CELL_DISPLAY_SIZE, CELL_DISPLAY_SIZE);
      }
    }
    // grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= gridW; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_DISPLAY_SIZE + 0.5, 0);
      ctx.lineTo(i * CELL_DISPLAY_SIZE + 0.5, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= gridH; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_DISPLAY_SIZE + 0.5);
      ctx.lineTo(canvas.width, i * CELL_DISPLAY_SIZE + 0.5);
      ctx.stroke();
    }
  }

  function paintAt(clientX, clientY, erase) {
    const areaRect = canvasArea.getBoundingClientRect();
    const screenX = clientX - areaRect.left;
    const screenY = clientY - areaRect.top;
    const g = screenToGrid(view, CELL_DISPLAY_SIZE, screenX, screenY);
    const cx = Math.floor(g.x);
    const cy = Math.floor(g.y);
    if (cx < 0 || cy < 0 || cx >= gridW || cy >= gridH) return;
    const size = Number(brushSizeInput.value);
    const color = erase ? null : currentColor();
    for (const cell of brushCells(gridW, gridH, cx, cy, size)) {
      setCell(cells, gridW, cell.x, cell.y, color);
    }
    render();
  }

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    if (spaceHeld || e.button === 1) return;
    painting = true;
    paintingErase = eraserActive || e.button === 2;
    pushSnapshot(undoStack, cells);
    if (!paintingErase) {
      palette = addColor(palette, currentColor());
      savePalette(localStorage, project, palette);
      renderPalette();
    }
    canvas.setPointerCapture(e.pointerId);
    paintAt(e.clientX, e.clientY, paintingErase);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!painting) return;
    paintAt(e.clientX, e.clientY, paintingErase);
  });
  canvas.addEventListener("pointerup", () => { painting = false; });
  canvas.addEventListener("pointerleave", () => { painting = false; });

  canvasArea.addEventListener("wheel", (e) => {
    e.preventDefault();
    const areaRect = canvasArea.getBoundingClientRect();
    const screenX = e.clientX - areaRect.left;
    const screenY = e.clientY - areaRect.top;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    view = zoomAt(view, CELL_DISPLAY_SIZE, screenX, screenY, view.zoom * factor);
    applyTransform();
  }, { passive: false });

  let spaceHeld = false;
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && document.activeElement.tagName !== "INPUT") {
      spaceHeld = true;
      canvasArea.style.cursor = "grab";
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") {
      spaceHeld = false;
      canvasArea.style.cursor = "";
    }
  });

  let panning = false;
  let panOrigin = null;
  canvasArea.addEventListener("pointerdown", (e) => {
    if (!(spaceHeld || e.button === 1)) return;
    e.preventDefault();
    panning = true;
    panOrigin = { x: e.clientX, y: e.clientY, panX: view.panX, panY: view.panY };
    canvasArea.classList.add("panning");
    canvasArea.setPointerCapture(e.pointerId);
  });
  canvasArea.addEventListener("pointermove", (e) => {
    if (!panning) return;
    view = panBy(
      { zoom: view.zoom, panX: panOrigin.panX, panY: panOrigin.panY },
      e.clientX - panOrigin.x,
      e.clientY - panOrigin.y
    );
    applyTransform();
  });
  canvasArea.addEventListener("pointerup", () => {
    panning = false;
    canvasArea.classList.remove("panning");
  });

  gridSizeSelect.addEventListener("change", () => {
    if (gridSizeSelect.value === "custom") return; // set programmatically only, not user-selectable
    resetGrid(parseInt(gridSizeSelect.value, 10));
  });
  colorPicker.addEventListener("input", () => {
    eraserActive = false;
    eraserBtn.classList.remove("active");
    renderPalette();
  });
  eraserBtn.addEventListener("click", () => {
    eraserActive = !eraserActive;
    eraserBtn.classList.toggle("active", eraserActive);
    renderPalette();
  });
  clearBtn.addEventListener("click", () => {
    if (confirm("Clear the whole canvas?")) loadGrid(gridW, gridH, Array.from({ length: gridW * gridH }, () => null));
  });

  saveBtn.addEventListener("click", async () => {
    const filename = filenameInput.value.trim();
    if (!project) {
      statusEl.textContent = "No project — open this from the editor.";
      statusEl.className = "status error";
      return;
    }
    if (!filename) {
      statusEl.textContent = "Enter a filename first.";
      statusEl.className = "status error";
      return;
    }

    // Export at native (1px-per-cell) resolution, not the zoomed-in display
    // size, so the saved asset is the actual pixel-art dimensions.
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = gridW;
    exportCanvas.height = gridH;
    const exportCtx = exportCanvas.getContext("2d");
    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const color = cells[y * gridW + x];
        if (!color) continue;
        exportCtx.fillStyle = color;
        exportCtx.fillRect(x, y, 1, 1);
      }
    }

    statusEl.textContent = "Saving…";
    statusEl.className = "status";

    try {
      const res = await fetch("/api/extensions/pixel-art/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project,
          filename,
          dataUrl: exportCanvas.toDataURL("image/png"),
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Save failed");

      statusEl.textContent = `Saved ${data.filename}`;
      statusEl.className = "status ok";
      // Let the host editor (if it's listening) know a new asset landed, so
      // it can refresh the Explorer's Assets tab without a manual reload.
      window.parent.postMessage(
        { type: "EXTENSION_ASSET_SAVED", extension: "pixel-art", project, filename: data.filename },
        "*"
      );
      refreshOpenList(data.filename);
    } catch (err) {
      statusEl.textContent = err instanceof Error ? err.message : String(err);
      statusEl.className = "status error";
    }
  });

  // --- Open existing art ---

  async function refreshOpenList(selectFilename) {
    if (!project) return;
    try {
      const res = await fetch(`/api/projects/${encodeURIComponent(project)}/assets`);
      const data = await res.json();
      const pngFiles = (data.files ?? []).filter((f) => f.toLowerCase().endsWith(".png"));

      openSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Load existing…";
      openSelect.appendChild(placeholder);
      for (const file of pngFiles) {
        const opt = document.createElement("option");
        opt.value = file;
        opt.textContent = stripExt(file);
        openSelect.appendChild(opt);
      }
      if (selectFilename) openSelect.value = selectFilename;
    } catch {
      // asset list is a convenience — silently skip if it can't be fetched
    }
  }

  async function openAsset(filename) {
    statusEl.textContent = "Loading…";
    statusEl.className = "status";
    try {
      const res = await fetch(`/api/projects/${encodeURIComponent(project)}/assets/raw/${encodeURIComponent(filename)}`);
      if (!res.ok) throw new Error("Failed to load asset");
      const blob = await res.blob();
      const bitmap = await createImageBitmap(blob);
      const w = bitmap.width;
      const h = bitmap.height;

      const tmp = document.createElement("canvas");
      tmp.width = w;
      tmp.height = h;
      const tctx = tmp.getContext("2d");
      tctx.drawImage(bitmap, 0, 0);
      const pixels = tctx.getImageData(0, 0, w, h).data;

      const data = new Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const a = pixels[i * 4 + 3];
        if (a === 0) {
          data[i] = null;
          continue;
        }
        const r = pixels[i * 4];
        const g = pixels[i * 4 + 1];
        const b = pixels[i * 4 + 2];
        data[i] = a === 255 ? rgbToHex(r, g, b) : `rgba(${r},${g},${b},${(a / 255).toFixed(3)})`;
      }

      loadGrid(w, h, data);
      palette = createPalette(uniqueColors(data));
      savePalette(localStorage, project, palette);
      renderPalette();

      // Only a square opened at one of the preset sizes maps back onto the
      // dropdown cleanly; anything else gets a synthetic "Custom" entry so
      // the true (possibly non-square) resolution stays visible and exact.
      const presetSizes = ["8", "16", "24", "32", "48"];
      if (w === h && presetSizes.includes(String(w))) {
        customSizeOption.style.display = "none";
        gridSizeSelect.value = String(w);
      } else {
        customSizeOption.textContent = `Custom (${w}×${h})`;
        customSizeOption.style.display = "";
        gridSizeSelect.value = "custom";
      }

      filenameInput.value = stripExt(filename);
      statusEl.textContent = `Opened ${filename}`;
      statusEl.className = "status ok";
    } catch (err) {
      statusEl.textContent = err instanceof Error ? err.message : String(err);
      statusEl.className = "status error";
    }
  }

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
  }

  openSelect.addEventListener("change", () => {
    const filename = openSelect.value;
    if (filename) openAsset(filename);
  });

  renderPalette();
  refreshOpenList();
  resetGrid(gridW);
</script>
</body>
</html>
