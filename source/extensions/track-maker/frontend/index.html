<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Track Maker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17181c;
    --bg-elevated: #202127;
    --bg-inset: #1b1c21;
    --border: #33343b;
    --text: #e8e8ec;
    --text-faint: #8a8b93;
    --accent: #4f9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 12px/1.4 -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    flex-wrap: wrap;
  }
  header strong { font-size: 13px; }
  label { color: var(--text-faint); display: flex; align-items: center; gap: 4px; }
  select, input[type="text"], input[type="number"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font: inherit;
  }
  button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--text-faint); }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  button.active { border-color: var(--accent); color: var(--accent); }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .tab-btn {
    padding: 4px 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
  }
  .tab-btn:hover {
    border-color: var(--text-faint);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #06121f;
    border-color: var(--accent);
    font-weight: 600;
  }
  .panels {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 10px 12px;
    gap: 10px;
  }
  .panel.hidden {
    display: none;
  }
  .panel .body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .panel-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .status { color: var(--text-faint); }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #4ade80; }

  /* ---- shared param-panel / slider styles (reused by Melody/Drums/Track) ---- */
  .split { display: flex; gap: 12px; height: 100%; }
  .side-panel { width: 300px; flex: 0 0 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .main-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px; }
  .side-panel h4 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); }
  .mood-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .mood-btn.active { border-color: var(--accent); color: var(--accent); }
  fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px 10px; margin: 0; }
  legend { padding: 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row label { flex: 0 0 100px; color: var(--text-faint); }
  .row input[type="range"] { flex: 1; }
  .row select { flex: 1; }
  .row .val { flex: 0 0 40px; text-align: right; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .wave-buttons { display: flex; gap: 4px; margin-bottom: 8px; }
  .wave-buttons button { flex: 1; padding: 4px 2px; font-size: 10px; }
  canvas.piano-roll { max-width: 100%; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; }
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport button { padding: 8px 18px; font-size: 13px; }
  .duration { color: var(--text-faint); font-size: 11px; }

  /* ---- drum step grid ---- */
  .grid-scroll { width: 100%; overflow-x: auto; }
  table#drumGrid { border-collapse: collapse; }
  table#drumGrid td { border: 1px solid var(--border); }
  table#drumGrid td.voice-label { color: var(--text-faint); padding: 0 8px; text-align: right; white-space: nowrap; }
  table#drumGrid td.step { width: 18px; height: 18px; background: var(--bg-inset); cursor: pointer; }
  table#drumGrid td.step:hover { background: var(--border); }
  table#drumGrid td.step.on { background: var(--accent); }

  /* ---- track section list ---- */
  #sectionList { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .section-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; }
  .section-row span { flex: 1; }
  .section-row button { padding: 2px 8px; }
</style>
</head>
<body>
  <header>
    <strong>🎼 Track Maker</strong>

    <label>Key
      <select id="key">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A" selected>A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
      </select>
    </label>

    <label>Scale
      <select id="scale">
        <option value="major" selected>major</option>
        <option value="naturalMinor">naturalMinor</option>
        <option value="harmonicMinor">harmonicMinor</option>
        <option value="dorian">dorian</option>
        <option value="mixolydian">mixolydian</option>
        <option value="majorPentatonic">majorPentatonic</option>
        <option value="minorPentatonic">minorPentatonic</option>
      </select>
    </label>

    <label>BPM
      <input type="number" id="tempo" value="120" min="40" max="240" />
    </label>

    <label>Seed
      <input type="number" id="seed" value="1" />
      <button id="reseedBtn">🎲</button>
    </label>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="melody">Melody</button>
    <button class="tab-btn" data-tab="drums">Drums</button>
    <button class="tab-btn" data-tab="track">Track</button>
  </div>

  <main class="panels">
    <section class="panel" id="panel-melody">
      <div class="body">
        <div class="split">
          <div class="side-panel">
            <div>
              <h4>Mood</h4>
              <div class="mood-row" id="moodRow"></div>
            </div>
            <fieldset>
              <legend>Melody</legend>
              <div id="melodyParams"></div>
              <div class="row">
                <label>Steps/Bar</label>
                <select id="stepsPerBar">
                  <option value="4">4</option>
                  <option value="8">8</option>
                  <option value="16" selected>16</option>
                </select>
              </div>
            </fieldset>
            <fieldset>
              <legend>Synth</legend>
              <div class="wave-buttons" id="waveButtons"></div>
              <div id="synthParams"></div>
            </fieldset>
          </div>
          <div class="main-panel">
            <canvas id="pianoRoll" class="piano-roll" width="900" height="260"></canvas>
            <div class="transport">
              <button id="playMelodyBtn" class="primary">▶ Play</button>
              <span class="duration" id="melodyDuration"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-footer">
        <input type="text" id="filename-melody" placeholder="my_melody" />
        <button id="save-melody" class="primary">Save to Assets</button>
        <span class="status" id="status-melody"></span>
      </div>
    </section>

    <section class="panel hidden" id="panel-drums">
      <div class="body">
        <div class="split">
          <div class="side-panel">
            <div>
              <h4>Style</h4>
              <div class="mood-row" id="drumStyleRow"></div>
            </div>
            <fieldset>
              <legend>Pattern</legend>
              <div id="drumParams"></div>
              <div class="row">
                <label>Steps/Bar</label>
                <select id="drumStepsPerBar">
                  <option value="8">8</option>
                  <option value="16" selected>16</option>
                  <option value="32">32</option>
                </select>
              </div>
            </fieldset>
            <fieldset>
              <legend>Voice</legend>
              <div class="row">
                <label>Voice</label>
                <select id="drumVoiceSelect"></select>
              </div>
              <div id="drumVoiceParams"></div>
            </fieldset>
          </div>
          <div class="main-panel">
            <div class="grid-scroll">
              <table id="drumGrid"></table>
            </div>
            <div class="transport">
              <button id="playDrumsBtn" class="primary">▶ Play</button>
              <span class="duration" id="drumsDuration"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-footer">
        <input type="text" id="filename-drums" placeholder="my_drums" />
        <button id="save-drums" class="primary">Save to Assets</button>
        <span class="status" id="status-drums"></span>
      </div>
    </section>

    <section class="panel hidden" id="panel-track">
      <div class="body">
        <div class="split">
          <div class="side-panel">
            <fieldset>
              <legend>Arrangement</legend>
              <div class="row">
                <label>Length (bars)</label>
                <input type="number" id="targetBars" value="32" min="1" max="256" />
                <span class="duration" id="targetDuration"></span>
              </div>
              <button id="generateArrangementBtn" class="primary">Generate Arrangement</button>
            </fieldset>
          </div>
          <div class="main-panel">
            <div id="sectionList"></div>
            <div class="transport">
              <button id="playTrackBtn" class="primary">▶ Play</button>
              <span class="duration" id="trackDuration"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-footer">
        <input type="text" id="filename-track" placeholder="my_track" />
        <button id="save-track" class="primary">Save to Assets</button>
        <span class="status" id="status-track"></span>
      </div>
    </section>
  </main>

<script type="module">
  import { MOODS, moodToParams, generateMelody } from "./js/melody.mjs";
  import { noteNameToMidi, scaleDegreeToMidi, SCALES } from "./js/theory.mjs";
  import { WAVEFORMS, renderLeadVoice, DEFAULT_DRUM_VOICE_PARAMS, renderDrumKit } from "./js/synth.mjs";
  import { DRUM_PATTERN_STYLES, KIT_VOICES, generateDrumPattern } from "./js/drums.mjs";
  import { encodeWav, bufferToDataUrl } from "./js/wav.mjs";
  import { generateArrangement, energyForSection, applyEnergyToMelodyParams, applyEnergyToDrumParams, scaleVelocity } from "./js/arrangement.mjs";
  import { mixBuffers } from "./js/mix.mjs";

  const SR = 44100;
  const params = new URLSearchParams(location.search);
  const project = params.get("project") || "";

  const keySelect = document.getElementById("key");
  const scaleSelect = document.getElementById("scale");
  const tempoInput = document.getElementById("tempo");
  const seedInput = document.getElementById("seed");

  // ---- Tab switching ----
  const tabBtns = document.querySelectorAll(".tab-btn");
  const panels = document.querySelectorAll(".panel");

  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const tabName = btn.dataset.tab;

      // Remove active class from all buttons
      tabBtns.forEach((b) => b.classList.remove("active"));
      // Add active class to clicked button
      btn.classList.add("active");

      // Hide all panels
      panels.forEach((p) => p.classList.add("hidden"));
      // Show selected panel
      const selectedPanel = document.getElementById(`panel-${tabName}`);
      if (selectedPanel) selectedPanel.classList.remove("hidden");
    });
  });

  // ---- Reseed button ----
  const reseedBtn = document.getElementById("reseedBtn");

  reseedBtn.addEventListener("click", () => {
    seedInput.value = Math.floor(Math.random() * 1e9);
    regenerateMelody();
    regenerateDrums();
  });

  keySelect.addEventListener("change", () => regenerateMelody());
  scaleSelect.addEventListener("change", () => regenerateMelody());
  seedInput.addEventListener("change", () => { regenerateMelody(); regenerateDrums(); });
  tempoInput.addEventListener("change", () => { updateMelodyDuration(); updateDrumsDuration(); updateTargetDuration(); updateTrackDuration(); });

  // ============================================================
  // ---- Melody tab ----
  // ============================================================

  // Generic slider-row builder, reused by the Drums/Track tabs (Tasks 12-13)
  // for the same param-panel pattern. `refs`, if given, is a registry object
  // that gets `refs[key] = { input, valEl, decimals }` so callers (e.g. mood
  // presets) can push a new value into the slider without re-deriving state.
  function buildSliderRow(container, { key, label, min, max, step, value, decimals = 2, onChange, refs }) {
    const row = document.createElement("div");
    row.className = "row";

    const labelEl = document.createElement("label");
    labelEl.textContent = label;

    const input = document.createElement("input");
    input.type = "range";
    input.min = String(min);
    input.max = String(max);
    input.step = String(step);
    input.value = String(value);
    input.dataset.key = key;

    const valEl = document.createElement("span");
    valEl.className = "val";
    valEl.textContent = Number(value).toFixed(decimals);

    input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      valEl.textContent = v.toFixed(decimals);
      onChange(v);
    });

    row.appendChild(labelEl);
    row.appendChild(input);
    row.appendChild(valEl);
    container.appendChild(row);

    if (refs) refs[key] = { input, valEl, decimals };
    return input;
  }

  const melodyState = {
    registerLowOctave: 0,
    registerHighOctave: 1,
    density: 0.35,
    jump: 0.15,
    syncopation: 0.1,
    restProb: 0.35,
    bars: 8,
    stepsPerBar: 16,
    synthParams: {
      waveform: "sine",
      attack: 0.02,
      decay: 0.15,
      sustainLevel: 0.7,
      release: 0.25,
      filterCutoff: 1,
      vibratoDepth: 0,
      vibratoRate: 5,
    },
    notes: [],
  };

  const melodySliderRefs = {};
  const melodyParamsEl = document.getElementById("melodyParams");
  const synthParamsEl = document.getElementById("synthParams");
  const moodRowEl = document.getElementById("moodRow");
  const waveButtonsEl = document.getElementById("waveButtons");
  const stepsPerBarSelect = document.getElementById("stepsPerBar");
  const pianoRollCanvas = document.getElementById("pianoRoll");
  const pianoRollCtx = pianoRollCanvas.getContext("2d");
  const playMelodyBtn = document.getElementById("playMelodyBtn");
  const melodyDurationEl = document.getElementById("melodyDuration");
  const filenameMelodyInput = document.getElementById("filename-melody");
  const saveMelodyBtn = document.getElementById("save-melody");
  const statusMelodyEl = document.getElementById("status-melody");

  // ---- mood presets ----
  Object.keys(MOODS).forEach((mood) => {
    const btn = document.createElement("button");
    btn.className = "mood-btn";
    btn.dataset.mood = mood;
    btn.textContent = mood.charAt(0).toUpperCase() + mood.slice(1);
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mood-btn").forEach((b) => b.classList.toggle("active", b === btn));
      const p = moodToParams(mood);
      Object.assign(melodyState, p);
      for (const key of Object.keys(p)) {
        const ref = melodySliderRefs[key];
        if (!ref) continue;
        ref.input.value = String(p[key]);
        ref.valEl.textContent = Number(p[key]).toFixed(ref.decimals);
      }
      regenerateMelody();
    });
    moodRowEl.appendChild(btn);
  });

  // ---- melody sliders ----
  buildSliderRow(melodyParamsEl, {
    key: "registerLowOctave", label: "Register Low", min: -2, max: 2, step: 1,
    value: melodyState.registerLowOctave, decimals: 0, refs: melodySliderRefs,
    onChange: (v) => { melodyState.registerLowOctave = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "registerHighOctave", label: "Register High", min: -2, max: 2, step: 1,
    value: melodyState.registerHighOctave, decimals: 0, refs: melodySliderRefs,
    onChange: (v) => { melodyState.registerHighOctave = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "density", label: "Density", min: 0, max: 1, step: 0.01,
    value: melodyState.density, decimals: 2, refs: melodySliderRefs,
    onChange: (v) => { melodyState.density = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "jump", label: "Jump", min: 0, max: 1, step: 0.01,
    value: melodyState.jump, decimals: 2, refs: melodySliderRefs,
    onChange: (v) => { melodyState.jump = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "syncopation", label: "Syncopation", min: 0, max: 1, step: 0.01,
    value: melodyState.syncopation, decimals: 2, refs: melodySliderRefs,
    onChange: (v) => { melodyState.syncopation = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "restProb", label: "Rest Prob", min: 0, max: 1, step: 0.01,
    value: melodyState.restProb, decimals: 2, refs: melodySliderRefs,
    onChange: (v) => { melodyState.restProb = v; regenerateMelody(); },
  });
  buildSliderRow(melodyParamsEl, {
    key: "bars", label: "Bars", min: 1, max: 32, step: 1,
    value: melodyState.bars, decimals: 0, refs: melodySliderRefs,
    onChange: (v) => { melodyState.bars = v; regenerateMelody(); },
  });

  stepsPerBarSelect.addEventListener("change", () => {
    melodyState.stepsPerBar = parseInt(stepsPerBarSelect.value, 10);
    regenerateMelody();
  });

  // ---- synth waveform + params ----
  WAVEFORMS.forEach((wf) => {
    const btn = document.createElement("button");
    btn.textContent = wf;
    btn.classList.toggle("active", wf === melodyState.synthParams.waveform);
    btn.addEventListener("click", () => {
      melodyState.synthParams.waveform = wf;
      document.querySelectorAll("#waveButtons button").forEach((b) => b.classList.toggle("active", b === btn));
    });
    waveButtonsEl.appendChild(btn);
  });

  const synthSliderRefs = {};
  buildSliderRow(synthParamsEl, {
    key: "attack", label: "Attack", min: 0, max: 2, step: 0.01,
    value: melodyState.synthParams.attack, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.attack = v; updateMelodyDuration(); },
  });
  buildSliderRow(synthParamsEl, {
    key: "decay", label: "Decay", min: 0, max: 2, step: 0.01,
    value: melodyState.synthParams.decay, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.decay = v; updateMelodyDuration(); },
  });
  buildSliderRow(synthParamsEl, {
    key: "release", label: "Release", min: 0, max: 2, step: 0.01,
    value: melodyState.synthParams.release, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.release = v; updateMelodyDuration(); },
  });
  buildSliderRow(synthParamsEl, {
    key: "sustainLevel", label: "Sustain", min: 0, max: 1, step: 0.01,
    value: melodyState.synthParams.sustainLevel, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.sustainLevel = v; },
  });
  buildSliderRow(synthParamsEl, {
    key: "filterCutoff", label: "Filter Cutoff", min: 0, max: 1, step: 0.01,
    value: melodyState.synthParams.filterCutoff, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.filterCutoff = v; },
  });
  buildSliderRow(synthParamsEl, {
    key: "vibratoDepth", label: "Vibrato Depth", min: 0, max: 1, step: 0.01,
    value: melodyState.synthParams.vibratoDepth, decimals: 2, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.vibratoDepth = v; },
  });
  buildSliderRow(synthParamsEl, {
    key: "vibratoRate", label: "Vibrato Rate", min: 0, max: 20, step: 0.1,
    value: melodyState.synthParams.vibratoRate, decimals: 1, refs: synthSliderRefs,
    onChange: (v) => { melodyState.synthParams.vibratoRate = v; },
  });

  // ---- generation ----
  function currentStepDurationSec() {
    const tempo = parseFloat(tempoInput.value) || 120;
    return 60 / tempo / (melodyState.stepsPerBar / 4);
  }

  function regenerateMelody() {
    const rootMidi = noteNameToMidi(keySelect.value, 4);
    const scaleName = scaleSelect.value;
    const seed = parseInt(seedInput.value, 10) || 0;

    melodyState.notes = generateMelody({
      rootMidi,
      scaleName,
      bars: melodyState.bars,
      stepsPerBar: melodyState.stepsPerBar,
      registerLowOctave: melodyState.registerLowOctave,
      registerHighOctave: melodyState.registerHighOctave,
      density: melodyState.density,
      jump: melodyState.jump,
      syncopation: melodyState.syncopation,
      restProb: melodyState.restProb,
      seed,
    });

    drawPianoRoll();
    updateMelodyDuration();
  }

  function updateMelodyDuration() {
    if (!melodyState.notes.length) {
      melodyDurationEl.textContent = "0.00s";
      return;
    }
    const stepDurationSec = currentStepDurationSec();
    const maxEndStep = Math.max(...melodyState.notes.map((n) => n.startStep + n.lengthSteps));
    const seconds = maxEndStep * stepDurationSec + melodyState.synthParams.release;
    melodyDurationEl.textContent = `${seconds.toFixed(2)}s`;
  }

  // ---- piano roll ----
  function getPianoRollLayout() {
    const scaleName = scaleSelect.value;
    const scaleLen = SCALES[scaleName].length;
    const minDegree = melodyState.registerLowOctave * scaleLen;
    const maxDegree = melodyState.registerHighOctave * scaleLen + (scaleLen - 1);
    const rowCount = Math.max(1, maxDegree - minDegree + 1);
    const rootMidi = noteNameToMidi(keySelect.value, 4);

    const rows = [];
    const midiToRow = new Map();
    for (let i = 0; i < rowCount; i++) {
      const degree = minDegree + i;
      const midi = scaleDegreeToMidi(rootMidi, scaleName, degree);
      rows.push({ degree, midi });
      midiToRow.set(midi, i);
    }

    const totalSteps = Math.max(1, melodyState.bars * melodyState.stepsPerBar);
    return { rowCount, rows, midiToRow, totalSteps, stepsPerBar: melodyState.stepsPerBar };
  }

  function drawPianoRoll() {
    const layout = getPianoRollLayout();
    const w = pianoRollCanvas.width;
    const h = pianoRollCanvas.height;
    const rowHeight = h / layout.rowCount;
    const colWidth = w / layout.totalSteps;

    pianoRollCtx.clearRect(0, 0, w, h);

    // horizontal gridlines (one per scale-degree row)
    pianoRollCtx.lineWidth = 1;
    pianoRollCtx.strokeStyle = "rgba(255,255,255,0.06)";
    for (let i = 0; i <= layout.rowCount; i++) {
      const y = i * rowHeight;
      pianoRollCtx.beginPath();
      pianoRollCtx.moveTo(0, y);
      pianoRollCtx.lineTo(w, y);
      pianoRollCtx.stroke();
    }

    // vertical gridlines (heavier every bar)
    for (let s = 0; s <= layout.totalSteps; s++) {
      const x = s * colWidth;
      pianoRollCtx.strokeStyle = s % layout.stepsPerBar === 0 ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.05)";
      pianoRollCtx.beginPath();
      pianoRollCtx.moveTo(x, 0);
      pianoRollCtx.lineTo(x, h);
      pianoRollCtx.stroke();
    }

    // notes — higher rows (higher scale degree / pitch) drawn nearer the top
    pianoRollCtx.fillStyle = "#4f9eff";
    for (const note of melodyState.notes) {
      const row = layout.midiToRow.get(note.midi);
      if (row === undefined) continue;
      const y = (layout.rowCount - 1 - row) * rowHeight;
      const x = note.startStep * colWidth;
      pianoRollCtx.fillRect(x + 1, y + 1, Math.max(1, note.lengthSteps * colWidth - 2), Math.max(1, rowHeight - 2));
    }
  }

  // ---- piano roll editing: click to add/remove, drag to extend length ----
  let dragNote = null;

  function eventToCell(evt) {
    const layout = getPianoRollLayout();
    const rect = pianoRollCanvas.getBoundingClientRect();
    const scaleX = pianoRollCanvas.width / rect.width;
    const scaleY = pianoRollCanvas.height / rect.height;
    const x = (evt.clientX - rect.left) * scaleX;
    const y = (evt.clientY - rect.top) * scaleY;

    const colWidth = pianoRollCanvas.width / layout.totalSteps;
    const rowHeight = pianoRollCanvas.height / layout.rowCount;

    const step = Math.max(0, Math.min(layout.totalSteps - 1, Math.floor(x / colWidth)));
    const yRow = Math.max(0, Math.min(layout.rowCount - 1, Math.floor(y / rowHeight)));
    const row = layout.rowCount - 1 - yRow;
    const midi = layout.rows[row].midi;
    return { step, midi };
  }

  function findNoteAt(step, midi) {
    return melodyState.notes.find(
      (n) => n.midi === midi && step >= n.startStep && step < n.startStep + n.lengthSteps
    );
  }

  pianoRollCanvas.addEventListener("mousedown", (evt) => {
    const { step, midi } = eventToCell(evt);
    const existing = findNoteAt(step, midi);
    if (existing) {
      melodyState.notes = melodyState.notes.filter((n) => n !== existing);
      dragNote = null;
      drawPianoRoll();
      return;
    }
    const note = { startStep: step, lengthSteps: 1, midi, velocity: 0.85 };
    melodyState.notes.push(note);
    dragNote = note;
    drawPianoRoll();
  });

  pianoRollCanvas.addEventListener("mousemove", (evt) => {
    if (!dragNote) return;
    const { step, midi } = eventToCell(evt);
    if (midi !== dragNote.midi) return;
    const newLength = Math.max(1, step - dragNote.startStep + 1);
    if (newLength === dragNote.lengthSteps) return;
    dragNote.lengthSteps = newLength;

    const start = dragNote.startStep;
    const end = start + newLength;
    melodyState.notes = melodyState.notes.filter(
      (n) => n === dragNote || n.midi !== dragNote.midi || n.startStep + n.lengthSteps <= start || n.startStep >= end
    );
    drawPianoRoll();
  });

  function endMelodyDrag() {
    if (!dragNote) return;
    dragNote = null;
    melodyState.notes.sort((a, b) => a.startStep - b.startStep);
    drawPianoRoll();
    updateMelodyDuration();
  }
  pianoRollCanvas.addEventListener("mouseup", endMelodyDrag);

  let melodyAudioCtx = null;

  function ensureMelodyAudioCtx() {
    if (!melodyAudioCtx) melodyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playMelody() {
    if (!melodyState.notes.length) return;
    const stepDurationSec = currentStepDurationSec();
    const samples = renderLeadVoice(melodyState.notes, melodyState.synthParams, SR, stepDurationSec);
    if (!samples.length) return;

    const ac = ensureMelodyAudioCtx();
    if (melodyCurrentSource) { try { melodyCurrentSource.stop(); } catch {} }
    const buffer = ac.createBuffer(1, samples.length, SR);
    buffer.copyToChannel(samples, 0);
    const source = ac.createBufferSource();
    source.buffer = buffer;
    source.connect(ac.destination);
    source.start();
    melodyCurrentSource = source;
    melodyDurationEl.textContent = `${(samples.length / SR).toFixed(2)}s`;
  }
  playMelodyBtn.addEventListener("click", playMelody);

  // ---- save ----
  saveMelodyBtn.addEventListener("click", async () => {

    statusMelodyEl.textContent = "Saving…";
    statusMelodyEl.className = "status";

    try {

      const wavBuffer = encodeWav(samples, SR);
      const dataUrl = bufferToDataUrl(wavBuffer);
      const res = await fetch("/api/extensions/track-maker/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },

        "*"

    } catch (err) {

    }

  // ---- seed a default mood so the tab isn't empty on load ----
  const defaultMoodBtn = moodRowEl.querySelector('[data-mood="calm"]');

  // ============================================================
  // ---- Drums tab ----
  // ============================================================

  function styleLabel(key) {

  const DRUM_VOICE_PARAM_FIELDS = [

    { key: "ampDecay", label: "Amp Decay", min: 0, max: 1, step: 0.01, decimals: 2 },
    { key: "toneNoiseMix", label: "Tone/Noise Mix", min: 0, max: 1, step: 0.01, decimals: 2 },

  ];

  const drumState = {
    style: "fourOnFloor",
    density: 0.7,
    swing: 0.1,
    syncopation: 0.2,

  const drumSliderRefs = {};

  // ---- style presets ----

  // ---- pattern sliders ----
  buildSliderRow(drumParamsEl, {

  const drumVoiceSliderRefs = {};

  function loadVoiceParamsIntoSliders(voice) {

  drumVoiceSelect.addEventListener("change", () => {

  // ---- generation ----
  function currentDrumStepDurationSec() {
    const tempo = parseFloat(tempoInput.value) || 120;
    return 60 / tempo / (drumState.stepsPerBar / 4);
  }

  function regenerateDrums() {
    const seed = parseInt(seedInput.value, 10) || 0;

    const { grid } = generateDrumPattern({
      bars: drumState.bars,
      stepsPerBar: drumState.stepsPerBar,
      style: drumState.style,
      density: drumState.density,
      syncopation: drumState.syncopation,
      seed,
    });
    drumState.grid = grid;

    renderDrumGridTable();
    updateDrumsDuration();
  }

  function updateDrumsDuration() {
    if (!drumState.bars) {
      drumsDurationEl.textContent = "0.00s";
      return;
    }
    const stepDurationSec = currentDrumStepDurationSec();
    const totalSteps = drumState.bars * drumState.stepsPerBar;
    const seconds = totalSteps * stepDurationSec;
    drumsDurationEl.textContent = `${seconds.toFixed(2)}s`;
  }

  // ---- step grid ----
  function renderDrumGridTable() {
    drumGridTable.innerHTML = "";
    const totalSteps = drumState.bars * drumState.stepsPerBar;

    KIT_VOICES.forEach((voice) => {
      const tr = document.createElement("tr");

      const labelTd = document.createElement("td");
      labelTd.className = "voice-label";
      labelTd.textContent = voice;
      tr.appendChild(labelTd);

      const hits = drumState.grid[voice] || [];
      for (let step = 0; step < totalSteps; step++) {
        const td = document.createElement("td");
        td.className = "step";
        if (hits[step]) td.classList.add("on");
        td.addEventListener("click", () => {
          const on = !drumState.grid[voice][step];
          drumState.grid[voice][step] = on;
          td.classList.toggle("on", on);
        });
        tr.appendChild(td);
      }

      drumGridTable.appendChild(tr);
    });
  }

  // ---- playback ----
  let drumsAudioCtx = null;
  let drumsCurrentSource = null;

  function ensureDrumsAudioCtx() {
    if (!drumsAudioCtx) drumsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return drumsAudioCtx;
  }

  function playDrums() {
    if (!drumState.bars) return;
    const stepDurationSec = currentDrumStepDurationSec();
    const samples = renderDrumKit(drumState.grid, drumState.voiceParams, SR, stepDurationSec, drumState.swing);
    if (!samples.length) return;

    const ac = ensureDrumsAudioCtx();
    if (drumsCurrentSource) { try { drumsCurrentSource.stop(); } catch {} }
    const buffer = ac.createBuffer(1, samples.length, SR);
    buffer.copyToChannel(samples, 0);
    const source = ac.createBufferSource();
    source.buffer = buffer;
    source.connect(ac.destination);
    source.start();
    drumsCurrentSource = source;
    drumsDurationEl.textContent = `${(samples.length / SR).toFixed(2)}s`;
  }
  playDrumsBtn.addEventListener("click", playDrums);

  // ---- save ----
  saveDrumsBtn.addEventListener("click", async () => {
    const filename = filenameDrumsInput.value.trim();
    if (!project) {
      statusDrumsEl.textContent = "No project — open this from the editor.";
      statusDrumsEl.className = "status error";
      return;
    }
    if (!filename) {
      statusDrumsEl.textContent = "Enter a filename first.";
      statusDrumsEl.className = "status error";
      return;
    }
    if (!drumState.bars) {
      statusDrumsEl.textContent = "Nothing generated yet.";
      statusDrumsEl.className = "status error";
      return;
    }

    statusDrumsEl.textContent = "Saving…";
    statusDrumsEl.className = "status";

    try {
      const stepDurationSec = currentDrumStepDurationSec();
      const samples = renderDrumKit(drumState.grid, drumState.voiceParams, SR, stepDurationSec, drumState.swing);
      const wavBuffer = encodeWav(samples, SR);
      const dataUrl = bufferToDataUrl(wavBuffer);
      const res = await fetch("/api/extensions/track-maker/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project, filename, dataUrl }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Save failed");

      statusDrumsEl.textContent = `Saved ${data.filename}`;
      statusDrumsEl.className = "status ok";
      window.parent.postMessage(
        { type: "EXTENSION_ASSET_SAVED", extension: "track-maker", project, filename: data.filename },
        "*"
      );
    } catch (err) {
      statusDrumsEl.textContent = err instanceof Error ? err.message : String(err);
      statusDrumsEl.className = "status error";
    }
  });

  // ---- seed a default style so the tab isn't empty on load ----
  const defaultStyleBtn = drumStyleRowEl.querySelector('[data-style="fourOnFloor"]');
  if (defaultStyleBtn) defaultStyleBtn.click();
  else regenerateDrums();

  // ============================================================
  // ---- Track tab ----
  // ============================================================

  const trackState = { targetBars: 32, arrangement: null };

  const targetBarsInput = document.getElementById("targetBars");
  const targetDurationEl = document.getElementById("targetDuration");
  const generateArrangementBtn = document.getElementById("generateArrangementBtn");
  const sectionListEl = document.getElementById("sectionList");
  const playTrackBtn = document.getElementById("playTrackBtn");
  const trackDurationEl = document.getElementById("trackDuration");
  const filenameTrackInput = document.getElementById("filename-track");
  const saveTrackBtn = document.getElementById("save-track");
  const statusTrackEl = document.getElementById("status-track");

  // ---- length readout ----
  // `<input type="number" max="256">` only enforces its `max` via spinner
  // clicks — a value typed directly (or pasted) bypasses it entirely, so the
  // JS-side clamp below is the only real guard against a runaway render
  // (plan's Global Constraints: "a few hundred bars max"). Read through this
  // helper everywhere targetBars is consumed, never `targetBarsInput.value`
  // directly.
  const TARGET_BARS_MIN = 1;
  const TARGET_BARS_MAX = 256;

  function getClampedTargetBars() {
    const raw = parseInt(targetBarsInput.value, 10);
    const fallback = Number.isFinite(raw) ? raw : TARGET_BARS_MIN;
    return Math.min(TARGET_BARS_MAX, Math.max(TARGET_BARS_MIN, fallback));
  }

  function updateTargetDuration() {
    const tempo = parseFloat(tempoInput.value) || 120;
    const targetBars = getClampedTargetBars();
    const secondsPerBar = (60 / tempo) * 4; // 4/4 time: a bar is always 4 quarter notes
    targetDurationEl.textContent = `(${(targetBars * secondsPerBar).toFixed(1)}s)`;
  }
  targetBarsInput.addEventListener("input", updateTargetDuration);
  // Snap the visible field back to the clamped value once the user commits
  // (blur/Enter), so a typed out-of-range number doesn't silently linger in
  // the UI while a different value is what actually gets generated.
  targetBarsInput.addEventListener("change", () => {
    targetBarsInput.value = String(getClampedTargetBars());
    updateTargetDuration();
  });
  updateTargetDuration();

  // ---- generation ----
  function currentTrackStepDurationSec() {
    const tempo = parseFloat(tempoInput.value) || 120;
    return 60 / tempo / (melodyState.stepsPerBar / 4);
  }

  function generateArrangementTrack() {
    const rootMidi = noteNameToMidi(keySelect.value, 4);
    const scaleName = scaleSelect.value;
    const seed = parseInt(seedInput.value, 10) || 0;

    trackState.arrangement = generateArrangement({
      rootMidi,
      scaleName,
      stepsPerBar: melodyState.stepsPerBar,
      melodyParams: {
        registerLowOctave: melodyState.registerLowOctave,
        registerHighOctave: melodyState.registerHighOctave,
        density: melodyState.density,
        jump: melodyState.jump,
        syncopation: melodyState.syncopation,
        restProb: melodyState.restProb,
      },
      drumParams: {
        style: drumState.style,
        density: drumState.density,
        syncopation: drumState.syncopation,
      },
      targetBars: getClampedTargetBars(),
      seed,
    });
    renderSectionList();
  }
  generateArrangementBtn.addEventListener("click", generateArrangementTrack);

  // ---- section list editing ----
  // Recomputes every section's absolute startStep (and shifts its melodyNotes'
  // startStep to match) after any reordering/regenerate/duplicate/remove edit.
  // drumGrid arrays stay section-relative (they're concatenated per-voice in
  // order at render time), so only startStep + melodyNotes need shifting.
  function recomputeSectionOffsets() {
    const stepsPerBar = melodyState.stepsPerBar;
    let startStep = 0;
    for (const section of trackState.arrangement.sections) {
      const delta = startStep - section.startStep;
      if (delta !== 0) {
        section.melodyNotes = section.melodyNotes.map((n) => ({ ...n, startStep: n.startStep + delta }));
      }
      section.startStep = startStep;
      startStep += section.bars * stepsPerBar;
    }
    trackState.arrangement.totalSteps = startStep;
  }

  function moveSection(index, direction) {
    const sections = trackState.arrangement.sections;
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= sections.length) return;
    const tmp = sections[index];
    sections[index] = sections[newIndex];
    sections[newIndex] = tmp;
    recomputeSectionOffsets();
    renderSectionList();
  }

  function regenerateSection(index) {
    const section = trackState.arrangement.sections[index];
    const rootMidi = noteNameToMidi(keySelect.value, 4);
    const scaleName = scaleSelect.value;
    const stepsPerBar = melodyState.stepsPerBar;
    const sectionSeed = Date.now() % 100000;

    // Apply the same per-type energy shaping generateArrangement uses
    // internally, so a regenerated section stays as audibly distinct
    // (density/register/velocity) as a freshly-generated one of that type,
    // rather than reverting to raw unscaled melodyState/drumState values.
    const energy = energyForSection(section.type);
    const rawMelodyParams = {
      registerLowOctave: melodyState.registerLowOctave,
      registerHighOctave: melodyState.registerHighOctave,
      density: melodyState.density,
      jump: melodyState.jump,
      syncopation: melodyState.syncopation,
      restProb: melodyState.restProb,
    };
    const sectionMelodyParams = applyEnergyToMelodyParams(rawMelodyParams, energy);
    const rawNotes = generateMelody({
      rootMidi,
      scaleName,
      bars: section.bars,
      stepsPerBar,
      ...sectionMelodyParams,
      seed: sectionSeed,
    });
    const scaledNotes = scaleVelocity(rawNotes, energy.velocityMult);
    section.melodyNotes = scaledNotes.map((n) => ({ ...n, startStep: n.startStep + section.startStep }));

    const rawDrumParams = {
      style: drumState.style,
      density: drumState.density,
      syncopation: drumState.syncopation,
    };
    const sectionDrumParams = applyEnergyToDrumParams(rawDrumParams, energy);
    const rawPattern = generateDrumPattern({
      bars: section.bars,
      stepsPerBar,
      ...sectionDrumParams,
      seed: sectionSeed + 1,
    });
    section.drumGrid = rawPattern.grid;

    recomputeSectionOffsets();
    renderSectionList();
  }

  function duplicateSection(index) {
    const sections = trackState.arrangement.sections;
    const original = sections[index];
    const clone = {
      type: original.type,
      bars: original.bars,
      startStep: original.startStep,
      melodyNotes: original.melodyNotes.map((n) => ({ ...n })),
      drumGrid: Object.fromEntries(
        Object.entries(original.drumGrid).map(([voice, hits]) => [voice, hits.slice()])
      ),
    };
    sections.splice(index + 1, 0, clone);
    recomputeSectionOffsets();
    renderSectionList();
  }

  function removeSection(index) {
    const sections = trackState.arrangement.sections;
    if (sections.length <= 1) return; // guard: never remove the last section
    sections.splice(index, 1);
    recomputeSectionOffsets();
    renderSectionList();
  }

  function renderSectionList() {
    sectionListEl.innerHTML = "";
    if (!trackState.arrangement) {
      updateTrackDuration();
      return;
    }

    trackState.arrangement.sections.forEach((section, index) => {
      const row = document.createElement("div");
      row.className = "section-row";

      const label = document.createElement("span");
      label.textContent = `${section.type} · ${section.bars} bars`;
      row.appendChild(label);

      const upBtn = document.createElement("button");
      upBtn.dataset.action = "up";
      upBtn.textContent = "↑";
      upBtn.addEventListener("click", () => moveSection(index, -1));
      row.appendChild(upBtn);

      const downBtn = document.createElement("button");
      downBtn.dataset.action = "down";
      downBtn.textContent = "↓";
      downBtn.addEventListener("click", () => moveSection(index, 1));
      row.appendChild(downBtn);

      const regenBtn = document.createElement("button");
      regenBtn.dataset.action = "regenerate";
      regenBtn.textContent = "🔁";
      regenBtn.addEventListener("click", () => regenerateSection(index));
      row.appendChild(regenBtn);

      const dupBtn = document.createElement("button");
      dupBtn.dataset.action = "duplicate";
      dupBtn.textContent = "⧉";
      dupBtn.addEventListener("click", () => duplicateSection(index));
      row.appendChild(dupBtn);

      const removeBtn = document.createElement("button");
      removeBtn.dataset.action = "remove";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => removeSection(index));
      row.appendChild(removeBtn);

      sectionListEl.appendChild(row);
    });

    updateTrackDuration();
  }

  function updateTrackDuration() {
    if (!trackState.arrangement || !trackState.arrangement.sections.length) {
      trackDurationEl.textContent = "0.00s";
      return;
    }
    const stepDurationSec = currentTrackStepDurationSec();
    const seconds = trackState.arrangement.totalSteps * stepDurationSec;
    trackDurationEl.textContent = `${seconds.toFixed(2)}s`;
  }

  // ---- mixdown ----
  function renderFullTrack() {
    const stepDurationSec = currentTrackStepDurationSec();
    const sections = trackState.arrangement.sections;

    const allNotes = sections.flatMap((s) => s.melodyNotes);
    const leadBuffer = renderLeadVoice(allNotes, melodyState.synthParams, SR, stepDurationSec);

    const combinedGrid = {};
    for (const voice of KIT_VOICES) {
      combinedGrid[voice] = [];
      for (const section of sections) {
        combinedGrid[voice] = combinedGrid[voice].concat(section.drumGrid[voice] || []);
      }
    }
    const drumBuffer = renderDrumKit(combinedGrid, drumState.voiceParams, SR, stepDurationSec, drumState.swing);

    return mixBuffers([leadBuffer, drumBuffer]);
  }

  // ---- playback ----
  let trackAudioCtx = null;
  let trackCurrentSource = null;

  function ensureTrackAudioCtx() {
    if (!trackAudioCtx) trackAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return trackAudioCtx;
  }

  function playTrack() {
    if (!trackState.arrangement) return;
    const samples = renderFullTrack();
    if (!samples.length) return;

    const ac = ensureTrackAudioCtx();
    if (trackCurrentSource) { try { trackCurrentSource.stop(); } catch {} }
    const buffer = ac.createBuffer(1, samples.length, SR);
    buffer.copyToChannel(samples, 0);
    const source = ac.createBufferSource();
    source.buffer = buffer;
    source.connect(ac.destination);
    source.start();
    trackCurrentSource = source;
    trackDurationEl.textContent = `${(samples.length / SR).toFixed(2)}s`;
  }
  playTrackBtn.addEventListener("click", playTrack);

  // ---- save ----
  saveTrackBtn.addEventListener("click", async () => {
    const filename = filenameTrackInput.value.trim();
    if (!project) {
      statusTrackEl.textContent = "No project — open this from the editor.";
      statusTrackEl.className = "status error";
      return;
    }
    if (!filename) {
      statusTrackEl.textContent = "Enter a filename first.";
      statusTrackEl.className = "status error";
      return;
    }
    if (!trackState.arrangement) {
      statusTrackEl.textContent = "Nothing generated yet.";
      statusTrackEl.className = "status error";
      return;
    }

    statusTrackEl.textContent = "Saving…";
    statusTrackEl.className = "status";

    try {
      const samples = renderFullTrack();
      const wavBuffer = encodeWav(samples, SR);
      const dataUrl = bufferToDataUrl(wavBuffer);
      const res = await fetch("/api/extensions/track-maker/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project, filename, dataUrl }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Save failed");

      statusTrackEl.textContent = `Saved ${data.filename}`;
      statusTrackEl.className = "status ok";
      window.parent.postMessage(
        { type: "EXTENSION_ASSET_SAVED", extension: "track-maker", project, filename: data.filename },
        "*"
      );
    } catch (err) {
      statusTrackEl.textContent = err instanceof Error ? err.message : String(err);
      statusTrackEl.className = "status error";
    }
  });

  // ---- generate a default arrangement so the tab isn't empty on load ----
  generateArrangementTrack();
</script>
</body>
</html>
