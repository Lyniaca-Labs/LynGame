<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17181c;
    --bg-elevated: #202127;
    --bg-inset: #1b1c21;
    --border: #33343b;
    --text: #e8e8ec;
    --text-faint: #8a8b93;
    --accent: #4f9eff;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 12px/1.4 -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    flex-wrap: wrap;
  }
  select, input[type="text"], textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font: inherit;
  }
  button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--text-faint); }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  .status { color: var(--text-faint); font-size: 11px; margin-left: auto; }
  .error-banner {
    background: #3a1d1d;
    color: #ffb3b3;
    border-bottom: 1px solid var(--danger);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
    padding: 10px;
    overflow-x: auto;
    align-items: flex-start;
  }
  .column {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 240px;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }
  .column-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
  }
  .drag-handle {
    cursor: grab;
    padding: 0 2px;
    color: var(--text-faint);
    user-select: none;
  }
  .column-header input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    font-weight: 600;
    font-size: 12px;
    color: var(--text);
  }
  .column-header input:focus { outline: none; background: var(--bg); border-radius: 3px; }
  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 20px;
  }
  .card {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.dragging { opacity: 0.4; }
  .add-card-row { padding: 6px; }
  .add-card-row input { width: 100%; }
  .add-column { width: 180px; min-width: 180px; }
  .add-column input { width: 100%; margin-bottom: 6px; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .panel {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    width: 360px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel input, .panel textarea { width: 100%; }
  .panel textarea { min-height: 100px; resize: vertical; }
  .panel-actions { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
  <header id="header"></header>
  <div id="errorBanner" class="error-banner" style="display:none">
    <span id="errorText"></span>
    <button id="errorRetry">Retry</button>
    <button id="errorDismiss">Dismiss</button>
  </div>
  <main id="main"></main>
  <div id="overlayRoot"></div>
  <script type="module">
    import { initBoardApp } from "./js/board.mjs";
    const params = new URLSearchParams(location.search);
    const project = params.get("project") || "";
    initBoardApp({
      project,
      header: document.getElementById("header"),
      main: document.getElementById("main"),
      overlayRoot: document.getElementById("overlayRoot"),
      errorBanner: document.getElementById("errorBanner"),
      errorText: document.getElementById("errorText"),
      errorRetry: document.getElementById("errorRetry"),
      errorDismiss: document.getElementById("errorDismiss"),
    });
  </script>
</body>
</html>
